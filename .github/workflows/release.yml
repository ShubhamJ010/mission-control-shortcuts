name: Xcode - Build, Package and Release

on:
  push:
    tags:
      - "v*" # Triggers the workflow only when you push a version tag like v1.0.0
  workflow_dispatch:

jobs:
  release:
    name: Build and Create Release
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin Xcode to match the latest stable available toolchain
      - name: Set Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo "SCHEME=$default" >> $GITHUB_ENV

          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then
            echo "FILETYPE_PARAM=workspace" >> $GITHUB_ENV
            echo "FILE_TO_BUILD=$(ls -A | grep -i \.xcworkspace\$ | head -n 1)" >> $GITHUB_ENV
          else
            echo "FILETYPE_PARAM=project" >> $GITHUB_ENV
            echo "FILE_TO_BUILD=$(ls -A | grep -i \.xcodeproj\$ | head -n 1)" >> $GITHUB_ENV
          fi

      # Builds the app in Release configuration to a custom build directory using ad-hoc local signing
      - name: Build App Binary
        run: |
          xcodebuild clean build \
            -scheme "${{ env.SCHEME }}" \
            -${{ env.FILETYPE_PARAM }} "${{ env.FILE_TO_BUILD }}" \
            -configuration Release \
            -sdk macosx \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath ./build/DerivedData \
            MACOSX_DEPLOYMENT_TARGET="$(xcrun --show-sdk-version)" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES

      # Locates the compiled .app file, signs with ad-hoc signature, packages ZIP, DMG, and SHA256
      - name: Package App into ZIP and DMG
        run: |
          APP_PATH=$(find ./build/DerivedData/Build/Products/Release -name "*.app" -type d -maxdepth 2 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ./build/DerivedData/Build/Products/Debug -name "*.app" -type d -maxdepth 2 | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found in build products" >&2
            exit 1
          fi

          echo "Found app bundle at: $APP_PATH"
          APP_NAME=$(basename "$APP_PATH")

          # Explicit ad-hoc code sign for Apple Silicon execution
          echo "Applying ad-hoc code signature..."
          codesign --force --deep --sign - "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH"

          mkdir -p dist
          cp -R "$APP_PATH" dist/

          # 1. Package ZIP
          cd dist
          zip -r "../${{ env.SCHEME }}.zip" "$APP_NAME"
          cd ..

          # 2. Package DMG with Applications symlink
          mkdir -p dmg_root
          cp -R "$APP_PATH" dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "${{ env.SCHEME }}" -srcfolder dmg_root -ov -format UDZO "${{ env.SCHEME }}.dmg"

          # 3. Generate SHA256 checksums
          shasum -a 256 "${{ env.SCHEME }}.zip" > "${{ env.SCHEME }}.zip.sha256"
          shasum -a 256 "${{ env.SCHEME }}.dmg" > "${{ env.SCHEME }}.dmg.sha256"

      # Extracts the changelog section matching the pushed tag (e.g. v0.7.0 -> "## 0.7.0")
      # and falls back to the top section or full changelog if no matching section exists
      - name: Extract Changelog Section
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9] ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            awk -v ver="$VERSION" '
              $0 ~ "^## " ver { flag=1; next }
              /^## / && flag { exit }
              flag' CHANGELOG.md > RELEASE_NOTES.md
          else
            awk '
              /^## / { count++; if (count == 1) { flag=1; next } if (count == 2) { exit } }
              flag' CHANGELOG.md > RELEASE_NOTES.md
          fi

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No changelog section found — falling back to full changelog"
            cp CHANGELOG.md RELEASE_NOTES.md
          fi

          echo "--- Release notes preview ---"
          cat RELEASE_NOTES.md

      # Generates a GitHub Release with the changelog section as notes,
      # attaching zipped app, DMG, checksums, and full changelog
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.SCHEME }}.zip
            ${{ env.SCHEME }}.zip.sha256
            ${{ env.SCHEME }}.dmg
            ${{ env.SCHEME }}.dmg.sha256
            CHANGELOG.md
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: false

      # Automatically update Homebrew tap cask (Casks/mcsc.rb) with new version & SHA256
      - name: Update Homebrew Tap
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_GITHUB_TOKEN secret is not set, skipping Homebrew tap update."
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          DMG_SHA=$(awk '{print $1}' "${{ env.SCHEME }}.dmg.sha256")

          echo "Updating Homebrew tap to version ${VERSION} with SHA256 ${DMG_SHA}..."

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/ShubhamJ010/homebrew-tap.git" tap
          cd tap

          CASK_FILE="Casks/mcsc.rb"
          if [ -f "$CASK_FILE" ]; then
            python3 -c "
          import re
          with open('$CASK_FILE', 'r') as f:
              c = f.read()
          c = re.sub(r'version \"[^\"]+\"', f'version \"${VERSION}\"', c, count=1)
          c = re.sub(r'sha256 \"[^\"]+\"', f'sha256 \"${DMG_SHA}\"', c, count=1)
          with open('$CASK_FILE', 'w') as f:
              f.write(c)
          "
            git add "$CASK_FILE"
            if git diff --cached --quiet; then
              echo "No changes in $CASK_FILE (already up to date)"
            else
              git commit -m "mcsc ${VERSION}"
              git push origin main
              echo "Homebrew tap updated and pushed successfully!"
            fi
          else
            echo "ERROR: $CASK_FILE not found in homebrew-tap" >&2
            exit 1
          fi
